services:
  blood-donation-system:
    image: aweenchal321/blood-donation-system:latest
    ports:
      - "8081:80"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - "--nginx.scrape-uri=http://blood-donation-system/stub_status"
    ports:
      - "9113:9113"
    depends_on:
      - blood-donation-system

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - nginx-exporter

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter